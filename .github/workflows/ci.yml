name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test built-ins
        run: |
          ircsh --command version
          ircsh --command status
          ircsh --command services
      - name: Verify arbitrary commands are rejected
        run: |
          set +e
          output="$(ircsh --command 'echo SHOULD_NOT_RUN' 2>&1)"
          rc=$?
          set -e
          test "$rc" -eq 2
          printf '%s\n' "$output" | grep -F 'ircsh: unknown command: echo SHOULD_NOT_RUN'
